[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "email-mcp"
version = "0.1.0"
description = "AI @ UCI MCP project: build an email MCP server step by step."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp[cli]==2.3.0", "python-dotenv==1.2.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/email_mcp"]
